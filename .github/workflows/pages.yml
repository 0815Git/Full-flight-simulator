# Puts the two screens on the web, at
# https://0815git.github.io/Full-flight-simulator/
#
# The pages are built here rather than committed: every push to main makes a
# fresh build and GitHub serves it. index.html is the simulator and map.html
# is the moving map, so the map opens in its own window from the live page
# exactly as it does on the bench.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # and whenever you press the button yourself

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a push that arrives mid-build waits its turn
# rather than cancelling what is already going out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
