     * new export. The one in use is shown light; the other three sit back in
     * the darker grey, which is what says "this is where you are".
     *
     * Every number and colour below comes from the knob block at the top of
     * this file. `--ui-scale-num` is the factor the artwork is scaled by, so
     * the chooser tracks the rest of the screen.
     */
    #layoutMenu {
      /* Under the LEFT THIRD, not under the whole plate: centred on that
         third's middle, which is what the button actually is. */
      position: absolute;
      top: calc(100% + var(--layoutmenu-y) * var(--ui-scale-num, 1));
      left: calc(var(--layout-hotspot-w) / 2);
      transform: translateX(calc(-50% + var(--layoutmenu-x) * var(--ui-scale-num, 1)));
      display: none; pointer-events: auto; z-index: 12;
      box-sizing: border-box;
      width: calc(var(--layoutmenu-w) * var(--ui-scale-num, 1));
      padding: calc(var(--layoutmenu-pad) * var(--ui-scale-num, 1));
      gap: calc(var(--layoutmenu-gap) * var(--ui-scale-num, 1));
      grid-template-columns: 1fr 1fr;
      background: var(--layoutmenu-bg);
      border-radius: calc(var(--layoutmenu-radius) * var(--ui-scale-num, 1));
      box-shadow: var(--layoutmenu-shadow);
    }
    #layoutMenu.is-open { display: grid; }

    /* One option: a frame with the panes of that arrangement inside it. */
    .layoutOpt {
      all: unset; box-sizing: border-box; cursor: pointer;
      display: grid; aspect-ratio: var(--layoutcell-aspect);
      padding: calc(var(--layoutcell-pad) * var(--ui-scale-num, 1));
      gap: calc(var(--layoutcell-gap) * var(--ui-scale-num, 1));
      background: var(--layoutcell-bg);
      border: calc(var(--layoutcell-border) * var(--ui-scale-num, 1)) solid transparent;
      border-radius: calc(var(--layoutcell-radius) * var(--ui-scale-num, 1));
    }
    .layoutOpt:hover { background: var(--layoutcell-bg-hover); }
    .layoutOpt:focus-visible { outline: 2px solid #8FC2FF; outline-offset: 2px; }
    /* The arrangement in use: light panes and a light rim around them. */
    .layoutOpt.is-selected {
      background: var(--layoutcell-bg-on);
      border-color: var(--layoutcell-border-on);
    }

    /* A pane inside an option. */
    .layoutOpt .pane {
      background: var(--layoutpane-bg);
      border-radius: calc(var(--layoutpane-radius) * var(--ui-scale-num, 1));
      display: grid; place-items: center;
      min-width: 0; min-height: 0;
    }
    .layoutOpt.is-selected .pane { background: var(--layoutpane-bg-on); }
    /* The map glyph marks which pane the map itself lives in: the artwork
       from public/icons, at its own proportions. */
    .layoutOpt .pane .glyph {
      display: block;
      width: var(--layoutglyph-w);
      max-width: calc(var(--layoutglyph-max) * var(--ui-scale-num, 1));
      height: auto;
      user-select: none; -webkit-user-drag: none;
    }

    /* The four arrangements, each as its own little grid. */
    #optSide { grid-template-columns: 5fr 1fr; }
    #optFull { grid-template-columns: 1fr; }
    #optHalf { grid-template-columns: 1fr 1fr; }
    #optFive { grid-template-columns: 1fr 2fr 1fr; }
    #optFive .col {
      display: grid; grid-template-rows: 1fr 1fr;
      gap: calc(var(--layoutcell-gap) * var(--ui-scale-num, 1)); min-width: 0;
    }
    /* A button whose PNG is not in the folder yet simply does not appear. */
    .mapBtn.is-missing { display: none; }

    /*
     * THE BOTTOM DATA PANEL — one PNG at the bottom centre of the map, with the
     * two numbers that have to move drawn ON it: fuel and altitude. The artwork
     * is exported WITHOUT them, so nothing has to be painted over; the readouts
     * are positioned as a share of the panel's own box, which keeps them on
     * their marks at any panel size and on any screen.
     */
    #bottomPanel {
      position: absolute;
      bottom: var(--bottompanel-bottom-fitted, var(--bottompanel-bottom));
      left: 50%; transform: translateX(-50%); z-index: 11;
      pointer-events: none;
    }
    /* THE BURST, over the camera's picture: held by its middle on the spot
       the simulator gives, sized as a share of the pane, never in the way of
       a press. It goes OVER the camera's own markings, as the thing nearest
       the eye.

       The file is drawn on BLACK rather than on nothing, so it is blended
       with what is under it instead of being pasted over it: in `screen`,
       black counts for nothing and only the fire shows. */
    .camBoom {
      position: absolute; z-index: 6;
      transform: translate(-50%, -50%);
      height: auto; pointer-events: none;
      mix-blend-mode: var(--boom-blend, screen);
    }
    .camBoom.is-off { display: none; }

    #bottomPanel.is-missing { display: none; }
    #bottomPanelImg { display: block; }
    /*
     * THE SLAVE KEY. The panel is one picture and the key is drawn into it, so
     * what reacts to a press is a clear region laid over that part of it, in
     * shares of the panel's own box — the same way the two readouts are
     * placed. It is the only part of the panel that takes a press, which is
     * why the panel itself lets presses through.
     */
    #slaveKey {
      position: absolute;
      left: var(--slave-key-x); top: var(--slave-key-y);
      width: var(--slave-key-w); height: var(--slave-key-h);
      margin: 0; padding: 0; border: 0; background: none;
      border-radius: 12%;
      pointer-events: auto; cursor: pointer;
    }
    /*
     * WHILE IT IS HOLDING SOMETHING the panel is swapped for the one drawn
     * with the key lit — Bottom Panel_slave.png, the same picture in every
     * other way. Swapping the whole panel rather than laying a lit key over
     * the plain one is what keeps it perfectly in register: there is nothing
     * to line up. See PANEL_PLAIN and PANEL_SLAVED in demo/map.ts.
     */
    .readout.is-off { display: none; }
    .readout {
      /* The x is where the number ENDS: it is pinned by its right edge, so a
         figure that grows a digit grows away from its unit, not into it. */
      position: absolute; transform: translate(-100%, -50%);
      white-space: nowrap;
      color: var(--readout-color);
      font-family: 'Roboto', system-ui, sans-serif;
      font-weight: var(--readout-weight);
      /* Figures of equal width: the number changes without the text shuffling. */
      font-variant-numeric: tabular-nums;
    }
    #fuelReadout {
      left: var(--readout-fuel-x); top: var(--readout-fuel-y);
      font-size: var(--readout-fuel-size-fitted, var(--readout-fuel-size));
    }
    #altReadout {
      left: var(--readout-alt-x); top: var(--readout-alt-y);
      font-size: var(--readout-alt-size-fitted, var(--readout-alt-size));
    }

    /* Shown until the first position arrives from the simulator window. It
       covers the map only — the panel is part of the screen from the start. */
    #wait {
      position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
      background: #0B1220; font-size: 20px; color: #98A6B9; text-align: center; padding: 24px;
    }
    #wait.is-hidden { display: none; }
  </style>
</head>
<body>
  <div id="topBar">
    <img id="topPanel" src="./icons/Top%20Panel.png" alt="">
    <!-- The clock in the panel's first box: the artwork's own figures are
         covered and these are written in their place, live. -->
    <div id="topClock" aria-hidden="true">
      <span id="clockH">23</span><span id="clockM">25</span><span id="clockS">29</span>
    </div>
  </div>
  <div id="screen">
    <!-- The two screens on the left of the map. Each is a SLOT: what it shows
         is chosen from the button in its own top-left corner, and the markup
         inside is built to match (see the pane kinds in demo/map.ts). The
         data-pane attribute is only what it opens on. -->
    <div class="sideCol" id="leftCol">
      <div class="sidePane" data-pane="cam"></div>
      <div class="sidePane" data-pane="weapon"></div>
    </div>

  <div id="mapArea">
    <canvas id="map"></canvas>

    <div id="mapButtons">
      <div class="row">
        <span class="hasHotspot">
          <img class="mapBtn wide" id="btnLayout" src="./icons/layout.png" alt="Layout">
          <button class="hotspot" id="btnLayoutLeft" type="button" aria-label="Layout"
                  aria-haspopup="true" aria-expanded="false"></button>

          <!-- The four arrangements. The map glyph marks the pane the map is in. -->
          <div id="layoutMenu" role="menu" aria-label="Screen layout">
            <button class="layoutOpt" id="optSide" type="button" role="menuitemradio"
                    data-layout="side" aria-checked="false" aria-label="Map with a side panel">
              <span class="pane"><img class="glyph" src="./icons/icon_map.png" alt=""></span>
              <span class="pane"></span>
            </button>
            <button class="layoutOpt" id="optFull" type="button" role="menuitemradio"
                    data-layout="full" aria-checked="true" aria-label="Map full screen">
              <span class="pane"><img class="glyph" src="./icons/icon_map.png" alt=""></span>
            </button>
            <button class="layoutOpt" id="optFive" type="button" role="menuitemradio"
                    data-layout="five" aria-checked="false" aria-label="Map between four panels">
              <span class="col"><span class="pane"></span><span class="pane"></span></span>
              <span class="pane"><img class="glyph" src="./icons/icon_map.png" alt=""></span>
              <span class="col"><span class="pane"></span><span class="pane"></span></span>
            </button>
            <button class="layoutOpt" id="optHalf" type="button" role="menuitemradio"
                    data-layout="half" aria-checked="false" aria-label="Map beside one panel">
              <span class="pane"><img class="glyph" src="./icons/icon_map.png" alt=""></span>
              <span class="pane"></span>
            </button>
          </div>
        </span>
        <!-- The map icons, in one column headed by the aircraft icon (with
             the live north dot riding on the pale ring drawn into it). The
             layout button sits beside the column's top, one gap to its left. -->
        <div class="iconCol">
          <span class="btnWrap">
            <img class="mapBtn square" id="btnIcon" src="./icons/icon.png" alt="Aircraft icon">
            <i id="iconNorth" aria-hidden="true"></i>
          </span>
          <img class="mapBtn tall" id="btn23d" src="./icons/2:3d.png" alt="2D / 3D">
          <!-- The zoom control: one picture with a + key at the top and a −
               key at the foot, each a live region over the artwork. -->
          <span class="hasZoomKeys">
            <img class="mapBtn square" id="btnZoom" src="./icons/zoom%20in:out_30.png" alt="Zoom in / out">
            <button class="zoomKey" id="btnZoomIn" type="button" aria-label="Zoom in"></button>
            <button class="zoomKey" id="btnZoomOut" type="button" aria-label="Zoom out"></button>
          </span>
          <img class="mapBtn square" id="btnLocation" src="./icons/Location%20on%20the%20map.png" alt="Location on the map">
        </div>
      </div>
    </div>

    <div id="mapButtonsLeft">
      <img class="mapBtn" id="btnFriends" src="./icons/Friends%20and%20targets_Close.png" alt="Friends and targets">
      <div id="friendPanel">
        <img class="mapBtn" id="friendList" data-match="btnFriends" src="./icons/Friend_list_open.png" alt="Friends">
        <img class="mapBtn" id="btnTargets" data-scale="friendList" src="./icons/Targets_Close.png" alt="Targets">
      </div>
    </div>

    <div id="mapButtonsBottom">
      <img class="mapBtn" id="btnRdr" src="./icons/RDR.png" alt="Radar">
      <img class="mapBtn tall" id="btnData" src="./icons/data.png" alt="Data">
      <img class="mapBtn square" id="btnTool" src="./icons/Tool.png" alt="Tool">
      <img class="mapBtn square" id="btnLayers" src="./icons/Layers.png" alt="Layers">
    </div>

    <div id="bottomPanel">
      <img class="mapBtn" id="bottomPanelImg" src="./icons/Bottom%20Panel.png" alt="">
      <!-- Only the figures: the panel's own artwork carries "lb", "ft" and the lamp. -->
      <div class="readout" id="fuelReadout"><span id="fuelNum">13,900</span></div>
      <div class="readout" id="altReadout"><span id="altNum">0</span></div>
      <!-- The Slave key: a clear region over that part of the artwork. The
           lit key is not laid over this one — the whole panel is swapped for
           the picture that has it lit, so the two can never fall out of
           register. -->
      <button id="slaveKey" type="button" aria-label="Slave the camera to the chosen mark"></button>
    </div>

    <div id="wait">Waiting for the simulator…<br>Start the flight in the simulator window.</div>
  </div>

    <!-- Half and half: the camera screen on the right of the map. -->
    <div class="sideCol" id="halfCol">
      <!-- Half and half: one big square beside the map, and it is a SLOT like
           the four small ones — the button in its corner chooses what is on
           it. It opens on the camera, which is the same screen as the one in
           the five-way arrangement: the picture is drawn into every camera
           canvas that is on show, so whichever arrangement is up gets it, at
           whatever size it has there. -->
      <div class="sidePane" data-pane="cam"></div>
    </div>

    <!-- The map with a bar beside it: the list above, the camera below. Both
         have artwork of their own for this arrangement — the 3_layout files,
         drawn at the shapes this bar gives them. -->
    <div class="sideCol" id="sideCol">
      <div class="sidePane" id="sideTop">
        <img src="./icons/list_3_layout.png" alt="List">
      </div>
      <div class="sidePane camPane" id="sideBottom">
        <canvas class="camView"></canvas>
        <img class="camOverlay" src="./icons/cam_3_layout.png" alt="Camera">
      </div>
    </div>

    <!-- …and two on its right. -->
    <!-- The right-hand column is the one that can run TALL: while its top
         screen is the targets list, the list takes the height of both and the
         screen under it is not there at all. Choose anything else on it and
         the column goes back to two, with the spare screen under it. -->
    <div class="sideCol" id="rightCol">
      <div class="sidePane" data-pane="targets"></div>
      <div class="sidePane" data-pane="radar"></div>
    </div>
  </div>

  <script type="module" src="./demo/map.ts"></script>
</body>
</html>
